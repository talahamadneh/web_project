<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Profile - Xplore Travel</title>
    <style>
        /* نسخ كامل للستايل كما أعطيتني إياه */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f5faf5;
            color: #333;
        }
        header {
            background-color: #073e0c;
            color: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
        }
        nav ul li a:hover {
            opacity: 0.85;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .profile-header {
            margin-bottom: 30px;
            text-align: center;
        }
        .profile-header h2 {
            margin-bottom: 10px;
            color: #073e0c;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .info-item label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4b4b4b;
        }
        .info-item span {
            display: block;
            background-color: #e1f3e1;
            padding: 10px;
            border-radius: 5px;
        }

        h3 {
            color: #073e0c;
            margin-bottom: 10px;
        }

        .bookings-table {
            width: 100%;
            border-collapse: collapse;
        }
        .bookings-table th, .bookings-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        .bookings-table th {
            background-color: #073e0c;
            color: #fff;
        }
        .bookings-table tr:nth-child(even) {
            background-color: #f0f9f0;
        }
        .bookings-table tr:hover {
            background-color: #d9efd9;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">✈ LIMITLESS JOURNEYS</div>
    <nav>
        <ul>
            <li><a href="project.html">Home</a></li>
            <li><a href="profile.php">Profile</a></li>
            <li><a href="about2.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <div class="profile-header">
        <h2>User Profile</h2>
        <p>Welcome back, traveler!</p>
    </div>

    <div class="info-grid">
        <div class="info-item">
            <label>Full Name</label>
            <span id="name"></span>
        </div>
        <div class="info-item">
            <label>User ID</label>
            <span id="id"></span>
        </div>
        <div class="info-item">
            <label>Email</label>
            <span id="email"></span>
        </div>
        <div class="info-item">
            <label>Phone</label>
            <span id="phone"></span>
        </div>
        <div class="info-item">
            <label>Password</label>
            <span>********</span>
        </div>

    </div>

    <h3>My Bookings</h3>
    <table class="bookings-table">
        <thead>
        <tr>
            <th>Booking ID</th>
            <th>Destination</th>
            <th>Trip Date</th>
            <th>Booking Date</th>
        </tr>
        </thead>
        <tbody id="bookings-body">
        </tbody>
    </table>
</div>
<script>
    fetch('profile.php')
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('name').textContent = data.user.FullName;
                document.getElementById('id').textContent = data.user.PersonID;
                document.getElementById('email').textContent = data.user.Email;
                document.getElementById('phone').textContent = data.user.PhoneNum;

                const bookingsBody = document.getElementById('bookings-body');
                bookingsBody.innerHTML = ''; // تفريغ القديم لو فيه

                data.bookings.forEach(b => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>${b.BookingID}</td>
                    <td>${b.destination}</td>
                    <td>${b.start_date}</td>
                    <td>${b.CreatedAt}</td>
                `;
                    bookingsBody.appendChild(tr);
                });
            } else {
                alert("يجب تسجيل الدخول أولاً");
                window.location.href = 'anotherlogin.html';
            }
        }).catch(error => {
        console.error("Error fetching profile:", error);
    });
</script>

</body>
</html>
