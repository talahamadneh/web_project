<head>
    <meta charset="UTF-8" />

    <title>Place Details</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f5f9;
            margin: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #206a24;
            margin-bottom: 30px;
        }

        .section {
            max-width: 900px;
            margin: 0 auto 40px auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .section h2 {
            margin-bottom: 25px;
            color: #073e0c;
            border-bottom: 3px solid #206a24;
            padding-bottom: 8px;
            font-size: 1.6rem;
        }

        /* Grid: 3 columns on wide screens, 2 on medium, 1 on small */
        .popular-areas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            text-align: center;
        }

        /* Card style for each area/restaurants/shopping spot */
        .popular-areas-grid .area {
            background-color: #caf0f8;
            padding: 20px;
            border-radius: 15px;
            font-size: 17px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
        }

        .popular-areas-grid .area:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.18);
        }

        .popular-areas-grid .area img {
            width: 260px;      /* عرض ثابت */
            height: 140px;     /* ارتفاع ثابت */
            object-fit: cover; /* لضبط الصورة داخل الحاوية */
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);

        }


        /* Text styles inside cards */
        .popular-areas-grid .area h3 {
            margin: 10px 0 8px;
            color: #073e0c;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .popular-areas-grid .area p {
            margin: 5px 0;
            font-weight: 600;
            color: #073e0c;
            font-size: 0.95rem;
        }

        /* Center item style (optional: إذا تبي تخلي عنصر معين ممتد على العمودين) */
        .popular-areas-grid .area.center-item {
            grid-column: 1 / -1;
            width: 300px;
            justify-self: center;
        }

        button {
            background-color: #206a24;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgb(7,62,12);
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #073e0c;
        }
        .popular-areas-grid .area .price {
            color: #2e7d32; /* أخضر غامق */
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 10px;
        }

    </style>
</head>

    function getQueryParams() {
        const params = {};
        window.location.search.substring(1).split("&").forEach(pair => {
            const [key, value] = pair.split("=");
            if (key && value) {
                params[key] = decodeURIComponent(value);
            }
        });
        return params;
    }

    function showPlace(continent, placeName) {
        const places = data[continent];
        if (!places) {
            alert("Continent not found!");
            return;
        }

        const place = places.find(p => p.name === placeName);
        if (!place) {
            alert("Place not found!");
            return;
        }
        // Popular Areas
        const popularContainer = document.getElementById('popularAreasList');
        place.popularAreas?.forEach(area => {
            const div = document.createElement('div');
            div.innerHTML = `
    <h3>${area.name}</h3>
    <img src="${area.img}" alt="${area.name}" style="width:100%;max-width:400px;border-radius:8px;" />
    <p>${area.desc}</p>
    <p><strong>Cost:</strong> ${area.cost}</p>
    <hr/>
  `;
            popularContainer.appendChild(div);
        });

// Famous Restaurants
        const restaurantContainer = document.getElementById('famousRestaurantsList');
        place.famousRestaurants?.forEach(res => {
            const div = document.createElement('div');
            div.innerHTML = `
    <h3>${res.name}</h3>
    <img src="${res.img}" alt="${res.name}" style="width:100%;max-width:400px;border-radius:8px;" />
    <p>${res.desc}</p>
    <p><strong>Rating:</strong> ${res.rating}</p>
    <p><strong>Price:</strong> ${res.price}</p>
    <hr/>
  `;
            restaurantContainer.appendChild(div);
        });

// Shopping Spots
        const shoppingContainer = document.getElementById('shoppingSpotsList');
        place.shoppingSpots?.forEach(shop => {
            const div = document.createElement('div');
            div.innerHTML = `
    <h3>${shop.name}</h3>
    <p>${shop.desc}</p>
    <p><strong>Cost:</strong> ${shop.cost}</p>
    <hr/>
  `;
            shoppingContainer.appendChild(div);
        });


        document.getElementById('placeName').textContent = place.name;
        document.getElementById('placeDesc').textContent = place.desc;
        document.getElementById('placeImage').src = place.img;
        document.getElementById('placeImage').alt = place.name;

    }

    const params = getQueryParams();
    if (params.continent && params.place) {
        showPlace(params.continent, params.place);
    } else {
        document.getElementById('placeContainer').innerHTML = '<p>Invalid place or continent specified.</p>';
    }
</script>
