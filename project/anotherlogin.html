<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Travel Agency</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .logo {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
        }

        .form-box {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 380px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.5s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-box h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .form-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
        }

        .form-box button {
            width: 100%;
            padding: 15px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .form-box button:hover {
            background-color: #019875;
        }

        .google-btn {
            background-color: white;
            color: #444;
            border: 1px solid #ccc;
        }

        .google-btn:hover {
            background-color: #f1f1f1;
        }

        .facebook-btn {
            background-color: #3b5998;
            color: white;
        }

        .facebook-btn:hover {
            background-color: #365899;
        }

        .twitter-btn {
            background-color: #1da1f2;
            color: white;
        }

        .twitter-btn:hover {
            background-color: #1991db;
        }

        .footer-links {
            margin-top: 15px;
            font-size: 1rem;
        }

        .footer-links a {
            color: #ccc;
            text-decoration: none;
            margin: 0 5px;
        }

        .footer-links a:hover {
            color: white;
        }

        .footer-links label {
            font-size: 1rem;
            color: #fff;
        }

        .create-account {
            margin-top: 20px;
            font-size: 1.1rem;
        }

        .create-account a {
            color: #00b894;
            text-decoration: none;
        }

        .create-account a:hover {
            text-decoration: underline;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        .social-buttons button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .success-message, .error-message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .success-message {
            background-color: #2ecc71;
            color: white;
        }

        .error-message {
            background-color: #e74c3c;
            color: white;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector("form");
            const h2 = document.querySelector(".form-box h2");
            const messageDiv = document.createElement("div");
            messageDiv.id = "login-message";
            h2.parentNode.insertBefore(messageDiv, h2);

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const formData = new FormData(form);

                try {
                    const response = await fetch("login.php", {
                        method: "POST",
                        body: formData
                    });

                    const result = await response.json();
                    messageDiv.textContent = result.message;
                    messageDiv.style.display = "block";

                    if (result.status === "success") {
                        messageDiv.className = "success-message";
                        setTimeout(() => {
                            window.location.href = "project.html";  // هنا التعديل
                        }, 1000);
                    } else {
                        messageDiv.className = "error-message";
                    }

                    setTimeout(() => {
                        messageDiv.style.display = "none";
                    }, 6000);

                } catch (error) {
                    messageDiv.textContent = "Server error. Please try again.";
                    messageDiv.className = "error-message";
                    messageDiv.style.display = "block";
                    setTimeout(() => {
                        messageDiv.style.display = "none";
                    }, 6000);
                }
            });
        });
    </script>

</head>

<body>
<video class="video-bg" autoplay muted loop>
    <source src="WhatsApp Video 2025-04-21 at 12.50.28_5f2e1b9c.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div class="overlay"></div>
<div class="logo">✈ LIMITLESS JOURNEYS</div>

<div class="container">
    <div class="form-box">
        <h2>Sign In</h2>
        <form action="login.php" method="POST">
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />
            <div class="social-buttons">
                <button type="submit" >Sign In</button>
            </div>
        </form>

        <div class="social-buttons">
            <button class="google-btn">
                <img src="https://img.icons8.com/color/16/000000/google-logo.png" />
                Sign in with Google
            </button>
            <button class="facebook-btn">
                <img src="https://img.icons8.com/color/16/000000/facebook.png" />
                Sign in with Facebook
            </button>
            <button class="twitter-btn">
                <img src="https://img.icons8.com/color/16/000000/twitter.png" />
                Sign in with Twitter
            </button>
        </div>

        <div class="footer-links">
            <label><input type="checkbox" /> Remember Me</label>
            <br>
            <a href="#">Forgot Password?</a>
        </div>

        <div class="create-account">
            <span>Don't have an account? <a href="creatAccount.html">Create one here</a></span>
        </div>
    </div>
</div>
</body>
</html>
