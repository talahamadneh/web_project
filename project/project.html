<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xplore Travel - Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }

    header {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
    }
    nav ul {
      display: flex;
      gap: 30px;
      margin-left: -150px;

    }
    nav ul li a {
      color: #fff;
      font-size: 1rem;
      transition: opacity 0.3s;
    }
    nav ul li a:hover { opacity: 0.7; }

    .hero {
      position: relative;
      width: 100%; height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }
    .hero video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 0 20px;
    }
    .hero h1 {
      font-size: 4rem;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .cta {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      border: 2px solid #fff;
      border-radius: 50px;
      transition: background 0.3s, color 0.3s;
      cursor: pointer;
    }
    .cta:hover {
      background: #fff;
      color: #333;
    }

    .slider-nav {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 10px;
      font-size: 1rem;
      z-index: 2;
    }
    .slider-nav button {
      background: rgba(255,255,255,0.5);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .slider-nav button:hover {
      background: rgba(255,255,255,0.8);
    }

    .socials {
      position: absolute;
      bottom: 20px;
      right: 40px;
      display: flex;
      gap: 15px;
      z-index: 2;
    }
    .socials a {
      color: #fff;
      font-size: 1.2rem;
      transition: opacity 0.3s;
    }
    .socials a:hover { opacity: 0.7; }
  </style>
</head>
<body>
<header>
  <div class="logo">✈ LIMITLESS JOURNEYS</div>
  <nav>
    <ul>
      <li><a href="project.html">Home</a></li>
      <li><a href="data.html">Profile</a></li>
      <li><a href="about2.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

</header>

<section class="hero">
  <!-- Video Background -->
  <video autoplay muted loop>
    <source src="WhatsApp Video 2025-04-21 at 12.50.28_5f2e1b9c.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- Hero Content -->
  <div class="hero-content">
    <h1>Explore the World</h1>
    <p>Don't listen to what they say. Go see.</p>
    <button class="cta" onclick="window.location.href='page2.html';">Travel Now</button>
  </div>
</section>
</body>
</html>
